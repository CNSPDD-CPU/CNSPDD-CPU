      action: "浏览代表性成果 →"
      url: "/cn/publications/"
    - number: "03"
      label: "PI 团队"
      title: "连接基础研究与药物研发"
      copy: "认识推动神经科学、疾病机制与原创药物研发协同发展的研究团队。"
      action: "认识 PI 团队 →"
      url: "/cn/pi/"
    - number: "04"
      label: "新闻动态"
      title: "科研现场正在发生"
