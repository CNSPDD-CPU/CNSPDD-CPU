en:
  hero:
    title: Center for Neuroscience and Innovative Drug Development
    subtitle: CNSIDD advances mechanism-based, sex-informed precision therapies for neurological and psychiatric disorders by decoding neuron-glia communication, disease vulnerability, and drug action across development, adulthood, and aging.
    primary_button: Research and Platforms
    secondary_button: Join the Center
    tags:
      - Sex-informed precision drug discovery
      - Dynamic neuron-glia communication
      - Early disease-modifying intervention windows
      - Cell-specific delivery and modulation
  mission:
    eyebrow: Center Mission
    title: A connected path from brain mechanisms to compound validation
    copy: "CNSIDD organizes its work across three complementary directions: investigator-driven basic research, organized precision drug development, and service-oriented testing of novel compounds that modulate brain function."
    cards:
      - title: Basic Research
        copy: Individual projects define mechanisms of brain function in health and disease, with emphasis on sex-specific neuron-glia interactions and early multicellular disease processes.
      - title: Drug Development
        copy: Organized projects develop cell-specific strategies to target intracellular signaling and intercellular communication in defined neuronal and glial populations.
      - title: Compound Validation
        copy: A service-oriented platform tests novel compounds for their ability to modulate brain function, circuit activity, and disease-relevant cellular communication.
cn:
  hero:
    title: 神经科学与原创药物研发中心
    subtitle: 中心面向神经与精神疾病，围绕神经元-胶质细胞通讯、性别特异性疾病易感性和药物作用机制，发展机制驱动、兼顾性别差异的精准治疗策略。
    primary_button: 研究与平台
    secondary_button: 加入我们
    tags:
      - 兼顾性别差异的精准药物发现
      - 动态神经元-胶质细胞通讯
      - 早期疾病修饰与预防窗口
      - 细胞特异性递送与调控
  mission:
    eyebrow: Center Mission
    title: 从脑功能机制到化合物验证的连续创新路径
    copy: 中心围绕三个互补方向开展工作：面向机制问题的基础研究、组织化推进的精准药物开发，以及服务于新型化合物评价的脑功能调控验证平台。
    cards:
      - title: 基础研究
        copy: 通过独立课题解析健康与疾病状态下的脑功能机制，重点关注性别特异性神经元-胶质细胞互作和早期多细胞疾病过程。
      - title: 药物开发
        copy: 通过组织化课题发展细胞特异性策略，精准靶向特定神经元和胶质细胞群体的细胞内信号与细胞间通讯。
      - title: 化合物验证
        copy: 建设服务型验证平台，系统测试新型化合物对脑功能、环路活动和疾病相关细胞通讯的调控能力。
