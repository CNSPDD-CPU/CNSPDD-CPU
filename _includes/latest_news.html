{% if page.url contains '/cn/' %}
{% assign latest_items = site.data.news.cn %}
{% else %}
{% assign latest_items = site.data.news.en %}
{% endif %}

<div class="news-grid" aria-label="{% if page.url contains '/cn/' %}最新新闻{% else %}Latest news{% endif %}">
  {% for item in latest_items limit: 3 %}
    <a href="{{ item.url | relative_url }}" class="news-item">
      <div class="news-date">{{ item.date }}</div>
      <span class="news-category {{ item.category_key }}">{{ item.category }}</span>
      <div class="news-title">{{ item.title }}</div>
      <div class="news-excerpt">{{ item.excerpt | truncate: 150 }}</div>
    </a>
  {% endfor %}
</div>
