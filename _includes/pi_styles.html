<style>

.pi-overview-page {
    --pi-ink: var(--site-navy);
    --pi-primary: var(--site-blue);
    --pi-accent: var(--site-cyan);
    --pi-mist: var(--site-mist);
    --pi-line: var(--site-line);
    --pi-muted: var(--site-muted);
    width: min(1160px, calc(100% - 3rem));
    margin: 0 auto;
    padding: 0 0 5.5rem;
    box-sizing: border-box;
}


.pi-skip-link {
    position: fixed;
    top: .75rem;
    left: 1rem;
    z-index: 2000;
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    padding: .6rem .9rem;
    border-radius: 999px;
    color: #fff;
    background: var(--pi-ink);
    box-shadow: 0 8px 20px rgba(6, 40, 74,.2);
    text-decoration: none;
    transform: translateY(-160%);
    transition: transform .2s ease;
}

.pi-skip-link::after {
    display: none;
}

.pi-skip-link:focus-visible {
    outline: 3px solid var(--pi-accent);
    outline-offset: 3px;
    transform: translateY(0);
}

.pi-overview-page [id] {
    scroll-margin-top: 7rem;
}

.pi-overview-hero {
    position: relative;
    isolation: isolate;
    display: grid;
    grid-template-columns: minmax(0, .95fr) minmax(320px, 1.05fr);
    gap: 3rem;
    align-items: end;
    padding: clamp(4.2rem, 7vw, 5.3rem) 0 clamp(3.7rem, 6vw, 4.5rem);
    border-bottom: 1px solid var(--pi-line);
}

.pi-overview-hero::before {
    position: absolute;
    inset: 0 calc(50% - 50vw);
    z-index: -1;
    border-top: 1px solid rgba(11, 99, 206, .08);
    border-bottom: 1px solid rgba(11, 99, 206, .12);
    border-radius: 0;
    background:
        linear-gradient(90deg, rgba(246, 249, 253, .98) 0%, rgba(246, 249, 253, .88) 48%, rgba(232, 241, 251, .42) 100%),
        url("{{ '/assets/images/backgrounds/subpage-header-neural-blue.webp' | relative_url }}") center right / cover no-repeat;
    box-shadow: none;
    content: "";
}

.pi-overview-kicker,
.pi-overview-section-label,
.pi-directory-label {
    margin: 0 0 .55rem;
    color: var(--pi-primary);
    font-size: .74rem;
    font-weight: 900;
    letter-spacing: .13em;
    text-transform: uppercase;
}

.pi-overview-hero h1 {
    max-width: 720px;
    margin: 0;
    color: var(--pi-ink);
    font-size: clamp(2.8rem, 5.6vw, 4.8rem);
    line-height: 1.02;
    letter-spacing: -.05em;
    text-wrap: balance;
    text-align: left;
    background: none;
    -webkit-text-fill-color: currentColor;
}

.pi-overview-intro {
    max-width: 52ch;
    margin: 0;
    color: var(--pi-muted);
    font-size: 1.06rem;
    line-height: 1.8;
}

.pi-overview-ribbon {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    gap: .9rem;
    align-items: center;
    margin-top: 1.2rem;
    padding-top: 1rem;
    border-top: 1px solid var(--pi-line);
}

.pi-overview-ribbon-mark {
    width: .55rem;
    height: 3.1rem;
    border-radius: 999px;
    background: linear-gradient(180deg, var(--pi-accent), var(--pi-primary));
}

.pi-overview-ribbon strong {
    display: block;
    color: var(--pi-ink);
    font-size: .9rem;
    letter-spacing: .04em;
}

.pi-overview-ribbon span {
    display: block;
    margin-top: .2rem;
    color: var(--pi-muted);
    font-size: .88rem;
    line-height: 1.5;
}

.pi-overview-section {
    margin-top: 4rem;
}

.pi-overview-section-head {
    display: flex;
    align-items: end;
    justify-content: space-between;
    gap: 1.25rem;
    margin-bottom: 1.1rem;
}

.pi-overview-section-head h2 {
    margin: 0;
    color: var(--pi-ink);
    font-size: 1.7rem;
    line-height: 1.2;
    text-wrap: balance;
    text-align: left;
}

.pi-overview-count {
    margin: 0;
    color: var(--pi-primary);
    font-size: .82rem;
    font-weight: 900;
    letter-spacing: .08em;
    text-transform: uppercase;
}

.pi-directory-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 1rem;
}

.pi-directory-card {
    display: grid;
    grid-template-columns: minmax(176px, .55fr) minmax(0, 1.45fr);
    overflow: hidden;
    border: 1px solid var(--pi-line);
    border-radius: 18px;
    color: inherit;
    background: linear-gradient(155deg, #fff 0%, #f7fbff 100%);
    box-shadow: 0 14px 38px rgba(7, 27, 51, .09);
    text-decoration: none;
    cursor: pointer;
    touch-action: manipulation;
    transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
}

.pi-directory-card::after {
    display: none;
}

.pi-directory-card:hover {
    border-color: rgba(11, 99, 206,.42);
    box-shadow: 0 20px 48px rgba(7, 27, 51, .14);
    color: inherit;
    transform: translateY(-3px);
}

.pi-directory-card:focus-visible {
    outline: 3px solid rgba(0, 127, 175,.55);
    outline-offset: 4px;
}

.pi-directory-media {
    position: relative;
    min-height: 280px;
    overflow: hidden;
    background: linear-gradient(155deg, var(--site-navy) 0%, var(--site-blue) 100%);
}

.pi-directory-media img {
    display: block;
    width: 100%;
    height: 100%;
    min-height: 280px;
    object-fit: cover;
    object-position: 50% 40%;
}

.pi-directory-stamp {
    position: absolute;
    left: 1.2rem;
    bottom: 1.15rem;
    z-index: 1;
    padding: .45rem .65rem;
    border: 1px solid rgba(255,255,255,.3);
    border-radius: 999px;
    color: #fff;
    background: rgba(6, 40, 74,.55);
    font-size: .72rem;
    font-weight: 900;
    letter-spacing: .1em;
    text-transform: uppercase;
    backdrop-filter: blur(10px);
}

.pi-directory-body {
    display: flex;
    min-width: 0;
    flex-direction: column;
    justify-content: center;
    padding: 1.55rem 1.65rem 1.7rem;
}

.pi-directory-label {
    color: var(--pi-accent);
}

.pi-directory-name {
    margin: 0;
    color: var(--pi-ink);
    font-size: clamp(1.85rem, 3.4vw, 2.8rem);
    line-height: 1;
    letter-spacing: -.04em;
    text-wrap: balance;
    text-align: left;
}

.pi-directory-subname {
    margin: .45rem 0 1rem;
    color: var(--pi-muted);
    font-size: 1rem;
    letter-spacing: .1em;
}

.pi-directory-role {
    margin: 0;
    color: var(--pi-primary);
    font-weight: 900;
    line-height: 1.5;
}

.pi-directory-summary {
    max-width: 650px;
    margin: .85rem 0 1rem;
    color: var(--pi-muted);
    line-height: 1.7;
}

.pi-directory-tags {
    display: flex;
    flex-wrap: wrap;
    gap: .5rem;
}

.pi-directory-tags span {
    display: inline-flex;
    align-items: center;
    min-height: 2rem;
    padding: .35rem .65rem;
    border: 1px solid rgba(11, 99, 206,.18);
    border-radius: 999px;
    color: var(--pi-primary);
    background: var(--pi-mist);
    font-size: .78rem;
    font-weight: 800;
}

.pi-directory-cta {
    display: inline-flex;
    align-items: center;
    gap: .55rem;
    margin-top: 1.25rem;
    color: var(--pi-ink);
    font-size: .9rem;
    font-weight: 900;
}

.pi-directory-cta span {
    color: var(--pi-accent);
    font-size: 1.25rem;
    line-height: 1;
    transition: transform .25s ease;
}

.pi-directory-card:hover .pi-directory-cta span,
.pi-directory-card:focus-visible .pi-directory-cta span {
    transform: translateX(4px);
}

.pi-directory-media--ziyang img {
    object-position: 50% 42%;
}
.pi-directory-media--yifei img {
    object-position: 50% 42%;
}
.pi-directory-media--lei img {
    object-position: 50% 42%;
}
.pi-directory-media--feng img {
    object-position: 50% 45%;
}
.pi-directory-media--kirchhoff img {
    object-position: 50% 45%;
}

.pi-directory-media--bai img {
    object-position: 50% 80%;
    transform: scale(1.2);
    transform-origin: 50% 100%;
}

@media (max-width: 980px) {
    .pi-directory-grid {
        grid-template-columns: 1fr;
    }
}

@media (max-width: 820px) {
    .pi-overview-page {
        width: min(100% - 1.5rem, 1160px);
        padding: 0 0 4rem;
    }

    .pi-overview-hero {
        grid-template-columns: 1fr;
        gap: 1rem;
        padding-top: 3rem;
    }

    .pi-directory-card {
        grid-template-columns: 180px minmax(0, 1fr);
    }

    .pi-directory-media,
    .pi-directory-media img {
        min-height: 280px;
    }

    .pi-directory-body {
        padding: 1.5rem;
    }
}

@media (max-width: 640px) {
    .pi-overview-page {
        width: min(100% - 1.25rem, 1160px);
    }

    .pi-overview-hero h1 {
        font-size: 2.55rem;
    }

    .pi-overview-section-head {
        align-items: start;
        flex-direction: column;
        gap: .35rem;
    }

    .pi-directory-card {
        display: block;
    }

    .pi-directory-media,
    .pi-directory-media img {
        min-height: 360px;
        max-height: 480px;
    }

    .pi-directory-body {
        padding: 1.45rem 1.25rem 1.6rem;
    }
}

@media (max-width: 640px) {
    .pi-directory-media--bai img {
        object-position: 50% 68%;
        transform: scale(1.08);
    }
}

@media (prefers-reduced-motion: reduce) {
    .pi-directory-card,
    .pi-directory-cta span,
    .pi-skip-link {
        transition: none;
    }
}

</style>
